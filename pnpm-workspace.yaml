packages:
  - "packages/*"
  - "packages/hardhat/templates/*"

allowBuilds:
  node-hid: true
  esbuild: false
  keccak: false
  unrs-resolver: false
  usb: false

hoistPattern:
  - "!@types/*"

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - hardhat
  - "@nomicfoundation/*"
  # Proof of concept only: explorer-verify 0.2.1 is newer than minimumReleaseAge.
  - explorer-verify
